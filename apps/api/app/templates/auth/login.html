<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Rahma CRM</title>
    <style>
        :root { --bg:#0b0f1a; --card:#1a2234; --border:rgba(255,255,255,0.09); --text:#f1f5f9; --muted:#94a3b8; --accent:#6366f1; --red:#ef4444; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; }
        .login-card { width:min(420px, calc(100vw - 2rem)); background:var(--card); border:1px solid var(--border); border-radius:0.75rem; padding:2rem; }
        h1 { margin:0 0 0.35rem; font-size:1.4rem; }
        p { margin:0 0 1.5rem; color:var(--muted); font-size:0.9rem; }
        label { display:block; margin:0.9rem 0 0.35rem; color:var(--muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; }
        input { width:100%; background:#0b0f1a; border:1px solid var(--border); color:var(--text); border-radius:0.5rem; padding:0.75rem 0.85rem; }
        button { width:100%; margin-top:1.25rem; border:0; border-radius:0.5rem; padding:0.75rem 1rem; color:white; background:var(--accent); font-weight:700; cursor:pointer; }
        .error { color:#fca5a5; border:1px solid rgba(239,68,68,0.25); background:rgba(239,68,68,0.1); padding:0.7rem 0.85rem; border-radius:0.5rem; font-size:0.85rem; margin-bottom:1rem; }
    </style>
</head>
<body>
    <form class="login-card" method="POST">
        <h1>Rahma CRM</h1>
        <p>Employee login is required for CRM changes.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Username</label>
        <input name="username" autocomplete="username" required>
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign In</button>
    </form>
</body>
</html>
