<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nanovate CRM</title>
    <style>
        :root { --bg:#121212; --card:#191919; --border:rgba(255,255,255,0.08); --text:#ffffff; --muted:#a3a3a3; --accent:#00d092; --red:#ef4444; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 82% 8%, rgba(0,208,146,0.08), transparent 30rem), var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; }
        .login-card { width:min(420px, calc(100vw - 2rem)); background:var(--card); border:1px solid var(--border); border-radius:8px; padding:2rem; }
        .brand-logo { display:block; width:127px; height:auto; margin:0 0 1.25rem; }
        h1 { margin:0 0 0.35rem; font-size:1.4rem; }
        p { margin:0 0 1.5rem; color:var(--muted); font-size:0.9rem; }
        label { display:block; margin:0.9rem 0 0.35rem; color:var(--muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; }
        input { width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:0.75rem 0.85rem; }
        input:focus { outline:none; border-color:#1acc96; box-shadow:0 0 0 3px rgba(0,208,146,0.14); }
        button { width:100%; margin-top:1.25rem; border:0; border-radius:6px; padding:0.75rem 1rem; color:#06120f; background:var(--accent); font-weight:700; cursor:pointer; }
        .error { color:#fca5a5; border:1px solid rgba(239,68,68,0.25); background:rgba(239,68,68,0.1); padding:0.7rem 0.85rem; border-radius:0.5rem; font-size:0.85rem; margin-bottom:1rem; }
    </style>
</head>
<body>
    <form class="login-card" method="POST">
        <img class="brand-logo" src="{{ url_for('static', filename='nanovate-logo.svg') }}" alt="Nanovate">
        <h1>Nanovate CRM</h1>
        <p>Employee login is required for CRM changes.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Username</label>
        <input name="username" autocomplete="username" required>
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign In</button>
    </form>
</body>
</html>
