<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slider Atom</title>
    <link rel="stylesheet" href="./atoms.css">
  </head>
  <body>
    <main class="nv-page">
      <section class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>Slider</h1>
            <p>Static version of `Slider.tsx`, including label, value, range input, and min/max helper labels.</p>
          </div>
        </header>
        <div class="nv-demo-panel">
          <label class="nv-slider">
            <span class="nv-slider__top">
              <span class="nv-label">Temperature</span>
              <span class="nv-slider__value">0.7</span>
            </span>
            <input type="range" min="0" max="1" step="0.1" value="0.7">
            <span class="nv-slider__bottom nv-type-caption">
              <span>Precise</span>
              <span>Creative</span>
            </span>
          </label>
        </div>
      </section>
    </main>
  </body>
</html>
