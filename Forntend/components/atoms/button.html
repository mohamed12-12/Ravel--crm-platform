<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Button Atom</title>
    <link rel="stylesheet" href="./atoms.css">
  </head>
  <body>
    <main class="nv-page">
      <section class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>Button</h1>
            <p>Static version of `Button.tsx`, including Figma variants, sizes, full width, delete, and disabled states.</p>
          </div>
        </header>
        <div class="nv-demo-section">
          <h2>Variants</h2>
          <div class="nv-demo-panel nv-row">
            <button class="nv-button nv-button--cta-primary">CTA Primary</button>
            <button class="nv-button nv-button--cta-secondary">CTA Secondary</button>
            <button class="nv-button nv-button--cta-tertiary">CTA Tertiary</button>
            <button class="nv-button nv-button--text-primary">Text Primary</button>
            <button class="nv-button nv-button--text-secondary">Text Secondary</button>
            <button class="nv-button nv-button--delete">Delete</button>
            <button class="nv-button nv-button--cta-primary" disabled>Disabled</button>
          </div>
        </div>
        <div class="nv-demo-section">
          <h2>Sizes</h2>
          <div class="nv-demo-panel nv-row">
            <button class="nv-button nv-button--cta-secondary nv-button--sm">Small</button>
            <button class="nv-button nv-button--cta-secondary">Medium</button>
            <button class="nv-button nv-button--cta-secondary nv-button--lg">Large</button>
            <button class="nv-button nv-button--cta-secondary nv-button--xl">Extra Large</button>
          </div>
        </div>
        <div class="nv-demo-section">
          <h2>Full Width</h2>
          <div class="nv-demo-panel">
            <button class="nv-button nv-button--cta-tertiary nv-button--full">Create Agent</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
