<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProgressBar Atom</title>
    <link rel="stylesheet" href="./atoms.css">
  </head>
  <body>
    <main class="nv-page">
      <section class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>ProgressBar</h1>
            <p>Static version of `ProgressBar.tsx`, using a CSS custom property for the fill percentage.</p>
          </div>
        </header>
        <div class="nv-demo-panel nv-stack">
          <div class="nv-progress" style="--progress: 68%;">
            <div class="nv-progress__labels"><span>1,360</span><span>2,000</span></div>
            <div class="nv-progress__track"><div class="nv-progress__bar"></div></div>
          </div>
          <div class="nv-progress" style="--progress: 32%;">
            <div class="nv-progress__track"><div class="nv-progress__bar"></div></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
