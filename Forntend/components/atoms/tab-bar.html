<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TabBar Atom</title>
    <link rel="stylesheet" href="./atoms.css">
  </head>
  <body>
    <main class="nv-page">
      <section class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>TabBar</h1>
            <p>Static version of `TabBar.tsx`, using ARIA tab roles and selected state.</p>
          </div>
        </header>
        <div class="nv-demo-panel">
          <div class="nv-tabs" role="tablist">
            <button class="nv-tab" role="tab" aria-selected="true">Overview</button>
            <button class="nv-tab" role="tab" aria-selected="false">Integrations</button>
            <button class="nv-tab" role="tab" aria-selected="false">Usage</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
