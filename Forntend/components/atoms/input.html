<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Input Atom</title>
    <link rel="stylesheet" href="./atoms.css">
  </head>
  <body>
    <main class="nv-page">
      <section class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>Input</h1>
            <p>Static version of `Input.tsx`, including label, description, focus, and error states.</p>
          </div>
        </header>
        <div class="nv-demo-grid">
          <label class="nv-field">
            <span class="nv-label">Agent name</span>
            <span class="nv-help">Used in dashboard cards and analytics.</span>
            <input class="nv-input" type="text" value="Sales Assistant">
          </label>
          <label class="nv-field nv-field--error">
            <span class="nv-label">Workspace URL</span>
            <input class="nv-input" type="url" value="nanovate">
            <span class="nv-error">Enter a valid URL.</span>
          </label>
        </div>
      </section>
    </main>
  </body>
</html>
