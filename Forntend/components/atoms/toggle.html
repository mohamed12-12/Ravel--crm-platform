<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toggle Atom</title>
    <link rel="stylesheet" href="./atoms.css">
  </head>
  <body>
    <main class="nv-page">
      <section class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>Toggle</h1>
            <p>Static version of `Toggle.tsx`, including on, off, disabled, and accessible switch attributes.</p>
          </div>
        </header>
        <div class="nv-demo-panel nv-row">
          <button class="nv-toggle" role="switch" aria-checked="true" aria-label="Dark mode"></button>
          <button class="nv-toggle" role="switch" aria-checked="false" aria-label="Notifications"></button>
          <button class="nv-toggle" role="switch" aria-checked="true" aria-label="Disabled toggle" disabled></button>
        </div>
      </section>
    </main>
  </body>
</html>
