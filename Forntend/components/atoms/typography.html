<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Typography Atom</title>
    <link rel="stylesheet" href="./atoms.css">
  </head>
  <body>
    <main class="nv-page">
      <section class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>Typography</h1>
            <p>Static version of `Typography.tsx`, with display, headings, body, label, and caption styles.</p>
          </div>
        </header>
        <div class="nv-demo-panel nv-stack">
          <h1 class="nv-type-display">Display title</h1>
          <h2 class="nv-type-h1">Dashboard heading</h2>
          <h3 class="nv-type-h2">Section heading</h3>
          <p class="nv-type-body">Body text uses Inter, neutral contrast, and comfortable line height for dashboard surfaces.</p>
          <span class="nv-label">Label text</span>
          <span class="nv-type-caption">Caption text</span>
        </div>
      </section>
    </main>
  </body>
</html>
