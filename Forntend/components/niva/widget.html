<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Niva Widget Component</title>
    <link rel="stylesheet" href="./niva.css">
  </head>
  <body>
    <main class="nv-page">
      <div class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>NivaWidget</h1>
            <p>Static version of `NivaWidget.tsx`: teaser card, floating launcher, close state, and unread badge.</p>
          </div>
        </header>
      </div>
    </main>

    <div class="nv-niva">
      <section class="nv-niva-teaser" role="button" tabindex="0" aria-label="Open Niva">
        <button class="nv-icon-button nv-niva-teaser__close" aria-label="Dismiss Niva message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <h2>Hey! I'm Niva</h2>
        <p>I can help you navigate the dashboard or build a better agent.</p>
      </section>

      <div class="nv-niva-launcher-wrap">
        <button class="nv-niva-launcher" aria-label="Open Niva">
          <svg width="31" height="18" viewBox="0 0 30.9992 18.0255" fill="none">
            <path d="M13.96 0.0057C14.4039 -0.0326 14.8459 0.1226 15.1802 0.4268L21.0141 7.0352C21.0602 7.0433 21.1409 6.9022 21.1716 6.868C22.3861 5.5221 23.6408 4.2065 24.8745 2.8768C25.5278 2.1716 26.1773 1.3838 26.8518 0.7089C28.9636 -1.4006 32.1841 2.2502 30.5546 4.2307L21.0141 14.2118L11.7483 4.1178C10.5127 2.5423 12.3286 0.1508 13.96 0.0057Z" fill="#46BB91"/>
            <path d="M9.9739 3.8139C10.3275 4.1322 10.6272 4.511 10.9501 4.8615C13.4231 7.5472 15.8981 10.2308 18.3519 12.9387C19.1513 13.8191 19.9507 14.349 19.5625 15.7412C19.2301 16.94 17.835 18.2395 16.5822 17.9957C16.0922 17.901 15.8289 17.6129 15.5003 17.2583C13.6768 15.2778 11.9704 13.1663 10.1642 11.1657C10.1353 11.1335 10.0027 10.9823 9.9739 10.9864C8.2676 12.8319 6.5766 14.6895 4.8606 16.5229C4.2573 17.1676 3.7788 17.897 2.8296 17.9574C1.0175 18.0743 -0.8906 15.4128 0.4507 13.7929L9.9758 3.8118L9.9739 3.8139Z" fill="#46BB91"/>
          </svg>
        </button>
        <span class="nv-niva-badge" aria-label="1 unread message from Niva">1</span>
      </div>
    </div>
  </body>
</html>
