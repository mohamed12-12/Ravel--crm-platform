<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Niva Panel Component</title>
    <link rel="stylesheet" href="./niva.css">
  </head>
  <body>
    <main class="nv-page">
      <div class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>NivaPanel</h1>
            <p>Static version of `NivaPanel.tsx`: header, scrollable messages, typing dots, error area, and composer.</p>
          </div>
        </header>

        <section class="nv-niva-panel" role="dialog" aria-label="Niva assistant">
          <header class="nv-niva-panel__header">
            <span class="nv-niva-panel__title">Niva</span>
            <button class="nv-icon-button" aria-label="Close Niva">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </header>
          <div class="nv-niva-panel__messages">
            <article class="nv-niva-message-item">
              <span class="nv-niva-message-item__avatar"><img src="../../assets/agent_icon.svg" alt="Niva"></span>
              <div class="nv-niva-message-item__content">
                <div class="nv-niva-message-item__meta"><span class="nv-niva-message-item__name">Niva</span><span class="nv-niva-message-item__time">2:34 PM</span></div>
                <div class="nv-niva-message-item__bubble"><div class="nv-niva-markdown"><p>Hi, I can help you navigate the dashboard.</p></div></div>
              </div>
            </article>
            <article class="nv-niva-message-item nv-niva-message-item--user">
              <div class="nv-niva-message-item__content">
                <div class="nv-niva-message-item__meta"><span class="nv-niva-message-item__time">2:35 PM</span><span class="nv-niva-message-item__name">You</span></div>
                <div class="nv-niva-message-item__bubble">Where can I create a voice agent?</div>
              </div>
              <span class="nv-niva-message-item__avatar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
                </svg>
              </span>
            </article>
            <div class="nv-niva-typing" aria-label="Niva is typing"><span></span><span></span><span></span></div>
          </div>
          <footer class="nv-niva-panel__composer">
            <div class="nv-niva-composer">
              <textarea rows="1" placeholder="Type a message..." aria-label="Message Niva"></textarea>
              <button aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M22 2 11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M22 2 15 22l-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </footer>
        </section>
      </div>
    </main>
  </body>
</html>
