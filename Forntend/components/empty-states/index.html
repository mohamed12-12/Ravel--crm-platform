<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nanovate Empty States</title>
    <link rel="stylesheet" href="./empty-states.css">
  </head>
  <body>
    <main class="nv-page">
      <div class="nv-demo-shell">
        <header class="nv-demo-header">
          <div>
            <h1>Empty States</h1>
            <p>Static equivalents for simple placeholder and under-construction UI states.</p>
          </div>
        </header>

        <section class="nv-demo-section">
          <h2>Under Construction</h2>
          <div class="nv-demo-panel">
            <div class="nv-empty-state">
              <div class="nv-empty-state__content">
                <span class="nv-empty-state__icon" aria-hidden="true">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path d="M14.7 6.3a4 4 0 0 0-5.66 5.66l-5.12 5.12a2 2 0 0 0 2.83 2.83l5.12-5.12a4 4 0 0 0 5.66-5.66l-2.12 2.12-2.83-2.83L14.7 6.3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
                <h3 class="nv-empty-state__title">Documentation</h3>
                <p class="nv-empty-state__description">This section is under construction</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
