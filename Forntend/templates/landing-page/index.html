<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nanovate Landing Template</title>
    <link rel="stylesheet" href="./landing-page.css">
  </head>
  <body>
    <main class="nv-landing">
      <nav class="nv-landing-nav">
        <img src="../../assets/logo.svg" alt="Nanovate">
        <div class="nv-landing-nav__links">
          <a href="#features">Features</a>
          <a href="#templates">Templates</a>
          <a href="#pricing">Pricing</a>
        </div>
        <button class="nv-button nv-button--cta-primary nv-button--sm">Start now</button>
      </nav>

      <section class="nv-hero">
        <div class="nv-hero__copy">
          <span class="nv-hero__eyebrow">AI agents and workflow automation</span>
          <h1>Nanovate</h1>
          <p>Launch chat agents, voice agents, and automation workflows from one dark operations dashboard built for reusable components.</p>
          <div class="nv-hero__actions">
            <button class="nv-button nv-button--cta-tertiary nv-button--lg">Create an agent</button>
            <button class="nv-button nv-button--cta-secondary nv-button--lg">View templates</button>
          </div>
        </div>
        <div class="nv-hero__media">
          <img src="../../assets/AuthDashScreenshot.png" alt="Nanovate dashboard preview">
        </div>
      </section>

      <section class="nv-landing-section" id="features">
        <h2>Reusable dashboard sections</h2>
        <div class="nv-feature-band">
          <article class="nv-stat-card nv-stat-card--green"><div class="nv-stat-card__inner"><div class="nv-stat-card__top"><p class="nv-stat-card__label">Chat<br>Agents</p><span class="nv-stat-card__icon">C</span></div><p class="nv-stat-card__value">18</p></div></article>
          <article class="nv-stat-card nv-stat-card--purple"><div class="nv-stat-card__inner"><div class="nv-stat-card__top"><p class="nv-stat-card__label">Voice<br>Agents</p><span class="nv-stat-card__icon">V</span></div><p class="nv-stat-card__value">6</p></div></article>
          <article class="nv-stat-card nv-stat-card--yellow"><div class="nv-stat-card__inner"><div class="nv-stat-card__top"><p class="nv-stat-card__label">Automation<br>Runs</p><span class="nv-stat-card__icon">A</span></div><p class="nv-stat-card__value">142</p></div></article>
        </div>
      </section>
    </main>
  </body>
</html>
