{% extends "crm_base.html" %}
{% set active_page = 'dashboard' %}

{% block content %}
<div class="animate-fade-in">
    <h2>Dashboard Overview</h2>

    <section class="stats-header" id="stats-container">
        <div class="stat-card">
            <span class="label">Total Travelers</span>
            <span class="value" id="stat-travelers">--</span>
        </div>
        <div class="stat-card">
            <span class="label">Leads Today</span>
            <span class="value" id="stat-leads-today">--</span>
        </div>
        <div class="stat-card">
            <span class="label">Booking Drafts</span>
            <span class="value" id="stat-bookings">--</span>
        </div>
        <div class="stat-card">
            <span class="label">Alerts</span>
            <span class="value" id="stat-alerts" style="color: var(--accent-orange);">--</span>
        </div>
    </section>

    <div class="dashboard-grid">
        <div class="data-panel">
            <div class="panel-header">
                <h3>Recent Travelers</h3>
                <a href="/crm/travelers" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">View All</a>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>ID</th>
                        <th>Status</th>
                        <th>Phone</th>
                    </tr>
                </thead>
                <tbody id="travelers-body">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>

        <div class="data-panel">
            <div class="panel-header">
                <h3>Sales Pipeline</h3>
            </div>
            <div style="padding: 1.5rem;" id="pipeline-container">
                <!-- Loaded via JS -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadDashboard() {
        const stats = await CRM_API.fetchStats();
        const crm = await CRM_API.fetchCrmPreview(5);

        // Update stats
        document.getElementById('stat-travelers').textContent = stats.travelerCount || 0;
        document.getElementById('stat-leads-today').textContent = stats.leadCount || 0;
        document.getElementById('stat-bookings').textContent = stats.bookingDraftCount || 0;
        document.getElementById('stat-alerts').textContent = stats.bookingAlertCount || 0;

        // Update travelers table
        const tbody = document.getElementById('travelers-body');
        tbody.innerHTML = crm.travelers.map(t => `
            <tr>
                <td style="font-weight: 500;">${t.name}</td>
                <td><code style="font-size: 0.75rem; color: var(--accent-blue);">${t.id}</code></td>
                <td><span class="badge ${t.status === 'Active' ? 'badge-green' : 'badge-blue'}">${t.status}</span></td>
                <td style="color: var(--text-secondary);">${t.phone}</td>
            </tr>
        `).join('');

        // Update pipeline
        const pipeline = document.getElementById('pipeline-container');
        if (stats.pipeline) {
            const p = stats.pipeline;
            pipeline.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                        <span class="label">New Leads</span>
                        <span style="font-weight: 600;">${p.newCustomers || 0}</span>
                    </div>
                    <div style="height: 6px; background: var(--bg-accent); border-radius: 3px; overflow: hidden;">
                        <div style="width: ${Math.min(100, (p.newCustomers / (stats.leadCount || 1)) * 100)}%; height: 100%; background: var(--accent-blue);"></div>
                    </div>
                </div>
                <div style="margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                        <span class="label">Qualified</span>
                        <span style="font-weight: 600;">${p.qualified || 0}</span>
                    </div>
                    <div style="height: 6px; background: var(--bg-accent); border-radius: 3px; overflow: hidden;">
                        <div style="width: ${p.qualificationRate || 0}%; height: 100%; background: var(--accent-green);"></div>
                    </div>
                </div>
                <div style="margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                        <span class="label">Booking Drafts</span>
                        <span style="font-weight: 600;">${p.bookingDrafts || 0}</span>
                    </div>
                    <div style="height: 6px; background: var(--bg-accent); border-radius: 3px; overflow: hidden;">
                        <div style="width: ${Math.min(100, (p.bookingDrafts / (stats.leadCount || 1)) * 100)}%; height: 100%; background: var(--accent-purple);"></div>
                    </div>
                </div>
            `;
        }
    }

    window.addEventListener('DOMContentLoaded', loadDashboard);
</script>
{% endblock %}
