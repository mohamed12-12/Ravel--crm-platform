<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Rahma Traveler - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=live-chat-1">
</head>
<body>
<div class="app-shell">
    <main class="workspace">
        <section class="chat-area glass-panel">
            <div class="chat-header">
                <div class="brand-block">
                    <img class="brand-wordmark" src="{{ url_for('static', filename='nanovate-logo.svg') }}" alt="Nanovate">
                    <img class="brand-wordmark brand-wordmark-secondary" src="{{ url_for('static', filename='client-logo.png') }}" alt="" onerror="this.style.display='none'">
                </div>
                <div class="status-indicator online" title="Online"></div>
            </div>

            <div class="chat-log" id="chat-log">
                <div class="empty-state">
                    <h3>Welcome</h3>
                    <p style="color:var(--text-dim);font-size:0.85rem;max-width:380px;margin:0 auto">
                        Send a message to get started.
                    </p>
                </div>
            </div>

            <!-- Intake Form -->
            <form id="intake-form" class="intake-form glass-card" hidden>
                <div style="margin-bottom:1rem">
                    <h3 style="font-size:1.05rem;color:var(--text-main);margin-bottom:4px">A few details to get started</h3>
                </div>
                <div class="form-grid">
                    <label><span>Full Name *</span><input id="full-name-input" type="text" required placeholder="e.g. Omar Mansour"></label>
                    <label><span>WhatsApp Number *</span><input id="phone-input" type="tel" required placeholder="e.g. 201012345678"></label>
                    <label><span>Birthday</span><input id="birthday-input" type="text" required placeholder="e.g. 21/08/1995 or 21 Aug 1995"></label>
                    <label><span>Gender</span>
                        <select id="gender-input" required>
                            <option value="Male" selected>Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </label>
                    <label><span>Nationality</span><input id="nationality-input" type="text" placeholder="Type nationality if known"></label>
                    <label><span>Country Code</span><input id="country-code-input" type="text" placeholder="e.g. 20, 966"></label>
                </div>
                <div style="display:flex;justify-content:flex-end;margin-top:1rem">
                    <button id="submit-intake-btn" type="submit" class="btn btn-primary" style="padding:0.6rem 1.5rem">Continue &rarr;</button>
                </div>
            </form>

            <!-- Quick Action Reply Buttons -->
            <div id="quick-actions" class="quick-actions" hidden>
                <button type="button" class="btn btn-quick" data-reply="local">Local Trip</button>
                <button type="button" class="btn btn-quick" data-reply="international">International Trip</button>
                <button type="button" class="btn btn-quick btn-confirm" data-reply="yes">Confirm</button>
                <button type="button" class="btn btn-quick" data-reply="no">Not Now</button>
                <button type="button" class="btn btn-quick" data-reply="single">Single Room</button>
                <button type="button" class="btn btn-quick" data-reply="double">Double Room</button>
                <button type="button" class="btn btn-quick" data-reply="triple">Triple Room</button>
                <button type="button" class="btn btn-quick" data-reply="with flights">With Flights</button>
                <button type="button" class="btn btn-quick" data-reply="no flights">No Flights</button>
                <button type="button" class="btn btn-quick" data-reply="egp">EGP</button>
                <button type="button" class="btn btn-quick" data-reply="usd">USD</button>
            </div>

            <!-- Message Composer -->
            <form id="message-form" class="composer">
                <input id="message-input" type="text" placeholder="Type your message here..." autocomplete="off" disabled>
                <input id="passport-file-input" type="file" accept=".jpg,.jpeg,.png,.gif,.pdf,.heic,.webp" hidden>
                <button type="button" class="btn btn-ghost" hidden id="passport-upload-btn">Attach Passport</button>
                <button type="submit" class="btn btn-primary" disabled id="send-btn">Send &#8599;</button>
            </form>
        </section>
    </main>
</div>

<script src="{{ url_for('static', filename='app.js') }}?v=live-chat-1"></script>
</body>
</html>
