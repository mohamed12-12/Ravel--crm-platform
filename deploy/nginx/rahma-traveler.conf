# Example nginx reverse proxy for a single-EC2-instance deployment.
# Install to /etc/nginx/sites-available/rahma-traveler.conf and symlink into
# sites-enabled, then run `certbot --nginx` to fill in the TLS block.
#
# Routing:
#   /webhook  -> AI agent service   (Meta/Instagram webhook - see services/instagram)
#   /         -> AI agent service   (customer-facing chat UI)
#   /crm/     -> CRM/API service    (strip /crm prefix; adjust if you deploy
#                                     the CRM under its own subdomain instead)
#   /socket.io/ -> CRM/API service  (Flask-SocketIO handoff notifications -
#                                     must support WebSocket upgrade)

upstream rahma_ai_agent {
    server 127.0.0.1:3001;
}

upstream rahma_crm_api {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name your-domain.example.com;

    # Meta requires the webhook callback URL to be HTTPS - keep this
    # redirect once certbot has issued a certificate.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    # ssl_certificate / ssl_certificate_key filled in by certbot.

    client_max_body_size 15m;

    location /crm/ {
        proxy_pass http://rahma_crm_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://rahma_crm_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://rahma_ai_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
