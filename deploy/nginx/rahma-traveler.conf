# Example nginx reverse proxy for a single-EC2-instance deployment.
# Install to /etc/nginx/sites-available/rahma-traveler.conf and symlink into
# sites-enabled, then run `certbot --nginx` to fill in the TLS block.
#
# Routing:
#   /rahma-agent/webhook -> AI agent service (Meta/Instagram webhook - see
#                            services/instagram; the Flask route itself is
#                            registered at this literal path in
#                            services/ai_agent/ai_agent_app/server.py, since
#                            Meta's callback URL is a fixed external
#                            reference, not run through this app's own
#                            X-Forwarded-Prefix/script_root prefixing)
#   /         -> AI agent service   (customer-facing chat UI)
#
# NOTE: on a shared EC2 instance running multiple unrelated apps behind one
# nginx, this app is typically NOT mounted at the domain root as the single
# location block below assumes - adjust to match whatever path prefix (e.g.
# /rahma-agent/) the real box actually uses, and keep the webhook location
# above in sync with server.py's route.
#   /crm/     -> CRM/API service    (strip /crm prefix; adjust if you deploy
#                                     the CRM under its own subdomain instead)
#   /socket.io/ -> CRM/API service  (Flask-SocketIO handoff notifications -
#                                     must support WebSocket upgrade)

# Ports corrected 2026-08-08 to match what's actually running (confirmed
# live): rahma_ai_agent is 5003, not 3001; rahma_crm_api is 5002, not
# 5000 -- this file had never been updated when either drift was found.
upstream rahma_ai_agent {
    server 127.0.0.1:5003;
}

upstream rahma_crm_api {
    server 127.0.0.1:5002;
}

server {
    listen 80;
    server_name your-domain.example.com;

    # Meta requires the webhook callback URL to be HTTPS - keep this
    # redirect once certbot has issued a certificate.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    # ssl_certificate / ssl_certificate_key filled in by certbot.

    client_max_body_size 15m;

    location /crm/ {
        proxy_pass http://rahma_crm_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for url_for() to generate correctly-prefixed URLs (the
        # app already reads this via ProxyFix(x_prefix=1) in
        # apps/api/app/__init__.py) -- without it, any template that
        # builds a URL by hand instead of through url_for() will silently
        # resolve against the wrong path once this app is not mounted at
        # the domain root, exactly like the /rahma-agent/webhook prefix
        # issue noted above.
        proxy_set_header X-Forwarded-Prefix /crm;
    }

    location /socket.io/ {
        proxy_pass http://rahma_crm_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://rahma_ai_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
